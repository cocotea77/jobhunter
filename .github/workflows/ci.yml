# Continuous Integration ("CI") — full workflow as of Step 6.
#
# In plain words: every proposed change is checked on a clean computer
# with a real database. If any check fails, the change cannot be merged.
#
# The four checks, in order:
#   1. Code style (ruff)
#   2. Test suite (pytest) — 60+ tests, including integration tests
#      against the real Postgres started below
#   3. Schema drift (alembic check) — models and migrations must agree
#   4. THE EVALUATION GATE (python -m evals.run) — the golden cases run
#      in fake mode against the committed baseline; any previously-
#      passing case that fails blocks the merge. Fake mode means this
#      costs nothing and needs no API key — it verifies structure,
#      plumbing, ranking behavior, and the gate itself. Real-model
#      quality runs happen locally before prompt-change Pull Requests
#      (see docs/06_STEP6_EVALS.md), until Step 8's spending cap makes
#      labeled real runs in CI safe.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
          POSTGRES_DB: jobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the application and the development tools
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check code style (ruff)
        run: ruff check .

      - name: Apply migrations to the CI database
        run: alembic upgrade head

      - name: Check schema drift (models vs migrations)
        run: alembic check

      - name: Run the test suite (pytest)
        run: pytest -v

      - name: Run the evaluation gate (fake mode, free)
        run: python -m evals.run --suite all --note "ci ${{ github.sha }}"
