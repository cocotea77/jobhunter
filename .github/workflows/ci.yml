# Continuous Integration ("CI").
#
# In plain words: every time someone proposes a code change on GitHub, this
# file tells GitHub to check the change automatically on a clean computer.
# If any check fails, the change cannot be merged into the main code.
#
# Step 1 upgrade: the checking computer now starts a REAL Postgres database
# (the same pgvector image we use locally) before running the checks, and
# the checks grew from two to five:
#
#   1. Code style (ruff)
#   2. Migrations apply cleanly to an empty database
#   3. No drift: the models and the migrations describe the same schema
#   4. Migrations can be reversed and re-applied (downgrade -> upgrade)
#   5. The full test suite — including the real-database integration tests,
#      which are never skipped here
#
# Checks 2-4 mean a broken migration is caught on the Pull Request,
# not during a deployment to the live website.

name: CI

on:
  pull_request:        # run on every proposed change
  push:
    branches: [main]   # and on every change that lands on main

jobs:
  checks:
    runs-on: ubuntu-latest

    # A throwaway database, created fresh for every run and destroyed
    # afterwards — identical in image and credentials to docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
          POSTGRES_DB: jobhunter
        ports:
          - 5432:5432
        # GitHub waits until the database reports "ready" before starting
        # our steps, so the checks never race a half-started database.
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://jobhunter:jobhunter@localhost:5432/jobhunter

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the application and the development tools
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check code style (ruff)
        run: ruff check .

      - name: Apply all migrations to an empty database
        run: alembic upgrade head

      - name: Check for drift between models and migrations
        run: alembic check

      - name: Prove migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run the test suite (pytest)
        run: pytest -v
