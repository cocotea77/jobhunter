# Alembic configuration file.
#
# Alembic is the migration tool: every change to the database's structure
# is a small, numbered, reviewable script in migrations/versions/.
# The three commands you will actually use:
#
#   alembic upgrade head      apply all migrations not yet applied
#   alembic revision --autogenerate -m "..."   draft a new migration by
#                             comparing app/models.py to the real database
#   alembic check             verify models and database agree (no drift)

[alembic]
script_location = migrations

# Let the migration tool import the application itself ("from app.config
# import ..."), by adding the project folder to Python's search path.
prepend_sys_path = .

# Note: no database address here. migrations/env.py reads it from the
# application's own settings instead, so there is exactly ONE place the
# address lives (app/config.py) and the migration tool can never point at
# a different database than the application by mistake.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
